<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Blue Hour Bar</title>

  <!-- 🍸 Favicon as Emoji SVG -->
  <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50%25' font-size='48'%3E🍸%3C/text%3E%3C/svg%3E"
        type="image/svg+xml" />

  <!-- Preload key fonts -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" as="style" onload="this.rel='stylesheet'">
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400&display=swap" as="style" onload="this.rel='stylesheet'">

  <!-- Google Fonts & FontAwesome (fallback for no‐JS) -->
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Open+Sans:wght@300;400&display=swap"
          rel="stylesheet">
  </noscript>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bar-body">

  <!-- OFF-CANVAS NAV -->
  <button class="nav-toggle" aria-label="Toggle menu">☰</button>
  <nav class="offcanvas">
    <ul>
      <li><a href="#home" data-en="Home" data-fr="Accueil"></a></li>
      <li><a href="#events" data-en="Events" data-fr="Événements"></a></li>
      <li><a href="#drinks" data-en="Drinks" data-fr="Boissons"></a></li>
      <li><a href="#book" data-en="Book" data-fr="Réserver"></a></li>
    </ul>
  </nav>
  
  <!-- LANGUAGE SWITCH -->
  <div class="lang-switch">
    <button id="to-en" class="active" data-en="EN" data-fr="EN"></button>
    <button id="to-fr" data-en="FR" data-fr="FR"></button>
  </div>

  <!-- HERO -->
  <section id="home" class="video-hero">
    <!-- 4. Video Fallback & Poster -->
    <video autoplay muted loop playsinline poster="hero-poster.png">
      <source src="bar-ambience.mp4" type="video/mp4" />
      <span data-en="Your browser doesn’t support video." data-fr="Votre navigateur ne prend pas en charge la vidéo."></span>
    </video>
    <div class="overlay"></div>
    <div class="hero-text">
      <h1 class="logo-text">THE BLUE HOUR BAR</h1>
      <p class="tagline" data-en="Where twilight meets taste" data-fr="Où le crépuscule rencontre le goût"></p>
    </div>
  </section>

<!-- EVENTS -->
<section id="events" class="section events-section">
  <h2 data-en="Events" data-fr="Événements"></h2>
  <div class="carousel">
    <div class="slides-container">
      <div class="slide" data-en="Live Jazz • Wed 8–11 pm" data-fr="Jazz en live • Mer 20h–23h"></div>
      <div class="slide" data-en="Karaoke Fridays • 9 pm–12 am" data-fr="Karaoké le vendredi • 21h–00h"></div>
      <div class="slide" data-en="Mixology Class • 1st Mon 7 pm" data-fr="Atelier mixologie • 1er lun. 19h"></div>
    </div>
  </div>

    <!-- this container will hold the JS‐generated dots -->
    <div class="carousel-dots"></div>

    <!-- (we already hid .scroll-hint, so you can leave this or remove it) -->
    <div class="scroll-hint" aria-hidden="true"></div>
  </section>

  <!-- DRINKS -->
  <section id="drinks" class="section drinks-section">
    <h2 data-en="Our Drinks" data-fr="Nos Boissons"></h2>
    <div class="drink-filters" role="group" aria-label="Filter drinks">
      <button data-filter="all" class="active" data-en="All" data-fr="Toutes"></button>
      <button data-filter="cocktail" data-en="Cocktails" data-fr="Cocktails"></button>
      <button data-filter="beer" data-en="Beer" data-fr="Bières"></button>
      <button data-filter="wine" data-en="Wine" data-fr="Vins"></button>
    </div>
    <div class="drink-grid">
      <!-- Cocktails -->
      <div class="menu-item" data-type="cocktail">
        <img src="margarita.jpg" alt="Margarita" loading="lazy" />
        <div class="menu-item-content">
          <h3>Margarita</h3>
          <p data-en="Tequila, triple sec, lime" data-fr="Tequila, triple sec, citron vert"></p>
        </div>
      </div>
      <div class="menu-item" data-type="cocktail">
        <img src="blue-lagoon.jpg" alt="Blue Lagoon" loading="lazy" />
        <div class="menu-item-content">
          <h3>Blue Lagoon</h3>
          <p data-en="Vodka, blue curaçao, lemonade" data-fr="Vodka, curaçao bleu, limonade"></p>
        </div>
      </div>
      <div class="menu-item" data-type="cocktail">
        <img src="negroni.jpg" alt="Negroni" loading="lazy" />
        <div class="menu-item-content">
          <h3>Negroni</h3>
          <p data-en="Campari, gin, sweet vermouth" data-fr="Campari, gin, vermouth doux"></p>
        </div>
      </div>
      <div class="menu-item" data-type="cocktail">
        <img src="old-fashioned.jpg" alt="Old Fashioned" loading="lazy" />
        <div class="menu-item-content">
          <h3>Old Fashioned</h3>
          <p data-en="Bourbon, sugar, bitters" data-fr="Bourbon, sucre, bitters"></p>
        </div>
      </div>
      <!-- Beers -->
      <div class="menu-item" data-type="beer">
        <img src="craft-beer.jpg" alt="Craft Beer" loading="lazy" />
        <div class="menu-item-content">
          <h3>Craft Beer</h3>
          <p data-en="Local brewery special" data-fr="Spécial brasserie locale"></p>
        </div>
      </div>
      <div class="menu-item" data-type="beer">
        <img src="ale.jpg" alt="Ale" loading="lazy" />
        <div class="menu-item-content">
          <h3>Ale</h3>
          <p data-en="Rich amber ale" data-fr="Ale ambrée riche"></p>
        </div>
      </div>
      <div class="menu-item" data-type="beer">
        <img src="guinness.jpg" alt="Guinness" loading="lazy" />
        <div class="menu-item-content">
          <h3>Guinness</h3>
          <p data-en="Classic stout" data-fr="Stout classique"></p>
        </div>
      </div>
      <!-- Wines -->
      <div class="menu-item" data-type="wine">
        <img src="white-wine.jpg" alt="White Wine" loading="lazy" />
        <div class="menu-item-content">
          <h3>White Wine</h3>
          <p data-en="Crisp chardonnay" data-fr="Chardonnay vif"></p>
        </div>
      </div>
      <div class="menu-item" data-type="wine">
        <img src="red-wine.jpg" alt="Red Wine" loading="lazy" />
        <div class="menu-item-content">
          <h3>Red Wine</h3>
          <p data-en="Full-bodied merlot" data-fr="Merlot corsé"></p>
        </div>
      </div>
      <div class="menu-item" data-type="wine">
        <img src="prosecco.jpg" alt="Prosecco" loading="lazy" />
        <div class="menu-item-content">
          <h3>Prosecco</h3>
          <p data-en="Light sparkling" data-fr="Pétillant léger"></p>
        </div>
      </div>
    </div>
    <a href="menu.pdf" target="_blank" rel="noopener" class="pdf-btn" data-en="View Menu (PDF)" data-fr="Voir le menu (PDF)"></a>
  </section>

  <!-- BOOKING FORM -->
  <section id="book" class="section book-section">
    <h2 data-en="Book Your Night" data-fr="Réservez votre soirée"></h2>
    <form action="javascript:void(0)" method="post" class="booking-form">
      <input type="text" name="name" placeholder="" data-en-placeholder="Your name" data-fr-placeholder="Votre nom" required />
      <input type="email" name="email" placeholder="" data-en-placeholder="Your email" data-fr-placeholder="Votre email" required />
      <textarea name="message" rows="4" placeholder="" data-en-placeholder="Your request..." data-fr-placeholder="Votre demande..." required></textarea>
      <!-- Honeypot field -->
      <input type="text" name="hp_field" class="sr-only" placeholder="Leave this blank" />
      <button type="submit" data-en="Send Inquiry" data-fr="Envoyer la demande"></button>
    </form>
    <p class="form-success" aria-live="polite"></p>
  </section>

  <!-- BACK TO TOP -->
  <button id="back-to-top" aria-label="Back to top">↑</button>

  <!-- STICKY FOOTER -->
  <footer class="social-footer">
    <div class="footer-inner">
      <div class="footer-left">
        <p class="footer-address">123 Twilight Avenue, Paris, FR</p>
      </div>
      <div class="footer-center">
        <p>&copy; 2025 The Blue Hour Bar</p>
      </div>
      <div class="footer-right">
        <!-- Instagram -->
        <a href="https://instagram.com" target="_blank" rel="noopener" aria-label="Instagram">
          <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">...</svg>
        </a>
        <!-- Facebook -->
        <a href="https://facebook.com" target="_blank" rel="noopener" aria-label="Facebook">
          <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">...</svg>
        </a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script>
    // Off-canvas toggle
    const navToggle = document.querySelector('.nav-toggle');
    const offcanvas = document.querySelector('.offcanvas');
    navToggle.onclick = e => {
      e.stopPropagation();
      offcanvas.classList.toggle('open');
    };
    document.addEventListener('click', e => {
      if (offcanvas.classList.contains('open') &&
          !offcanvas.contains(e.target) &&
          e.target !== navToggle) {
        offcanvas.classList.remove('open');
      }
    });

    /* ... rest of existing scripts ... */
  </script>

  <script>
    const toEn = document.getElementById('to-en');
    const toFr = document.getElementById('to-fr');

    function switchLang(lang) {
      toEn.classList.toggle('active', lang === 'en');
      toFr.classList.toggle('active', lang === 'fr');

      document.querySelectorAll('[data-en]').forEach(el => {
        el.textContent = el.getAttribute(`data-${lang}`);
      });
      document.querySelectorAll('[data-en-placeholder]').forEach(input => {
        input.placeholder = input.getAttribute(`data-${lang}-placeholder`);
      });
    }

    toEn.addEventListener('click', () => switchLang('en'));
    toFr.addEventListener('click', () => switchLang('fr'));

    switchLang('en');
  </script>

</body>
</html>
