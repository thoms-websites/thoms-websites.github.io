<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Blue Hour Bar</title>

  <!-- 🍸 Favicon as Emoji SVG -->
  <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50%25' font-size='48'%3E🍸%3C/text%3E%3C/svg%3E"
        type="image/svg+xml" />

  <!-- Preload key fonts -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" as="style" onload="this.rel='stylesheet'">
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400&display=swap" as="style" onload="this.rel='stylesheet'">

  <!-- Google Fonts & FontAwesome (fallback for no‐JS) -->
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Open+Sans:wght@300;400&display=swap"
          rel="stylesheet">
  </noscript>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bar-body">

  <!-- OFF-CANVAS NAV -->
  <button class="nav-toggle" aria-label="Toggle menu">☰</button>
  <nav class="offcanvas">
    <ul>
      <li><a href="#home" data-en="Home" data-fr="Accueil"></a></li>
      <li><a href="#events" data-en="Events" data-fr="Événements"></a></li>
      <li><a href="#drinks" data-en="Drinks" data-fr="Boissons"></a></li>
      <li><a href="#book" data-en="Book" data-fr="Réserver"></a></li>
    </ul>
  </nav>
  
  <!-- LANGUAGE SWITCH -->
  <div class="lang-switch">
    <button id="to-en" class="active" data-en="EN" data-fr="EN"></button>
    <button id="to-fr" data-en="FR" data-fr="FR"></button>
  </div>

  <!-- HERO -->
  <section id="home" class="video-hero">
    <video autoplay muted loop playsinline poster="hero-poster.png">
      <source src="bar-ambience.mp4" type="video/mp4" />
      <span data-en="Your browser doesn’t support video." data-fr="Votre navigateur ne prend pas en charge la vidéo."></span>
    </video>
    <div class="overlay"></div>
    <div class="hero-text">
      <h1 class="logo-text">THE BLUE HOUR BAR</h1>
      <p class="tagline" data-en="Where twilight meets taste" data-fr="Où le crépuscule rencontre le goût"></p>
    </div>
  </section>

  <!-- EVENTS -->
  <section id="events" class="section events-section">
    <h2 data-en="Events" data-fr="Événements"></h2>
    <div class="carousel">
      <div class="slides-container">
        <div class="slide" data-en="Live Jazz • Wed 8–11 pm" data-fr="Jazz en live • Mer 20h–23h"></div>
        <div class="slide" data-en="Karaoke Fridays • 9 pm–12 am" data-fr="Karaoké le vendredi • 21h–00h"></div>
        <div class="slide" data-en="Mixology Class • 1st Mon 7 pm" data-fr="Atelier mixologie • 1er lun. 19h"></div>
      </div>
    </div>
    <div class="carousel-dots"></div>
    <div class="scroll-hint" aria-hidden="true"></div>
  </section>

  <!-- DRINKS -->
  <section id="drinks" class="section drinks-section">
    <h2 data-en="Our Drinks" data-fr="Nos Boissons"></h2>
    <div class="drink-filters" role="group" aria-label="Filter drinks">
      <button data-filter="all" class="active" data-en="All" data-fr="Toutes"></button>
      <button data-filter="cocktail" data-en="Cocktails" data-fr="Cocktails"></button>
      <button data-filter="beer" data-en="Beer" data-fr="Bières"></button>
      <button data-filter="wine" data-en="Wine" data-fr="Vins"></button>
    </div>
    <div class="drink-grid">
      <!-- items omitted for brevity -->
    </div>
    <a href="menu.pdf" target="_blank" rel="noopener" class="pdf-btn" data-en="View Menu (PDF)" data-fr="Voir le menu (PDF)"></a>
  </section>

  <!-- BOOKING FORM -->
  <section id="book" class="section book-section">
    <h2 data-en="Book Your Night" data-fr="Réservez votre soirée"></h2>
    <!-- form omitted -->
  </section>

  <!-- BACK TO TOP -->
  <button id="back-to-top" aria-label="Back to top">↑</button>

  <!-- STICKY FOOTER -->
  <footer class="social-footer">
    <!-- footer omitted -->
  </footer>

  <!-- Scripts -->
  <script>
    // ... existing functions ...

    // Drink of the Day
    window.addEventListener('load', () => {
      const items = [...document.querySelectorAll('.menu-item')];
      const day = new Date().getDate();
      const featured = items[day % items.length];
      const type = featured.getAttribute('data-type');
      const titleEn = featured.querySelector('h3').getAttribute('data-en');
      const titleFr = featured.querySelector('h3').getAttribute('data-fr');
      const typeNames = {
        en: { cocktail: 'Cocktail', beer: 'Beer', wine: 'Wine' },
        fr: { cocktail: 'cocktail', beer: 'bière', wine: 'vin' }
      };
      const suffix = { en: 'of the Day', fr: 'du jour' };
      const lang = document.getElementById('to-fr').classList.contains('active') ? 'fr' : 'en';
      const badge = document.createElement('div');
      badge.className = 'featured-badge';
      badge.setAttribute('data-en', `${titleEn} - ${typeNames.en[type]} of the Day`);
      badge.setAttribute('data-fr', `${titleFr} - ${typeNames.fr[type]} du jour`);
      badge.textContent = badge.getAttribute(`data-${lang}`);
      featured.append(badge);
      featured.classList.add('featured');

      // update badge on language switch
      document.getElementById('to-en').addEventListener('click', () => {
        badge.textContent = badge.getAttribute('data-en');
      });
      document.getElementById('to-fr').addEventListener('click', () => {
        badge.textContent = badge.getAttribute('data-fr');
      });
    });

    // ... remaining scripts ...
  </script>
</body>
</html>
